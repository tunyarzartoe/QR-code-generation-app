<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
    <script src="components/loader.js"></script><script src="js/classic.js"></script>
    <link rel="stylesheet" href="components/loader.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- qrcode.js（JavaScriptのQRコード生成ライブラリ）の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>QRコード生成</h1>
        <p>テキストやURLを入力してください</p>
        <input type="text" id="text-input" placeholder="https://example.com">
        <div id="qrcode-container">
            <!-- 初期状態はCSSで非表示 -->
            <div id="qrcode"></div>
        </div>

        <!-- 初期状態はCSSで非表示 -->
        <button id="download-button">画像を保存する</button>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
